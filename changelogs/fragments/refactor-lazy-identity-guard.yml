---
# Fragment for the lazy identity guard refactor (2026-11-26).
# Compiles into changelogs/changelog.yaml at release time.
removed_features:
  - |
    `base` and `install` no longer meta-depend on `odem.os.user`: each resolves
    the identity facts lazily via a first-task `include_role {name:
    odem.os.user, tasks_from: identity.yml, public: true}` guard (`install`
    keeps its `odem.alloy.base` dependency). The other 7 roles inherit the
    `user_default_admin_group` global through `base`'s guard unchanged.
bugfixes:
  - |
    `sms` spec default and the `user_default_repo_dir` mirror in
    `defaults/main.yml` are now literals/renderable before any task —
    argument-spec validation renders role defaults before the guard runs.
