---

# No tasks — this role is a variable + handler carrier. It provides the
# shared alloy_* defaults and the "Restart alloy" handler to every other
# odem.alloy role via meta dependencies.
- name: Resolve identity facts when missing
  ansible.builtin.include_role:
    name: odem.os.user
    tasks_from: identity.yml
    public: true
  when: user_resolved is not defined or user_default_repo_dir_mps is not defined

